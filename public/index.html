<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10월 부동산</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2328;--sub:#6b7280;--bd:#cfc9bb;--ac:#2f6f4f;--good:#2f6f4f;--bad:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1e2126;--tx:#e8e8e8;--sub:#9aa0a6;--bd:#3d4148;--ac:#5fb98a;--good:#5fb98a;--bad:#f0895a}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1e2126;--tx:#e8e8e8;--sub:#9aa0a6;--bd:#3d4148;--ac:#5fb98a;--good:#5fb98a;--bad:#f0895a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:820px;margin:0 auto;padding:16px}
.title{border:1.5px solid var(--tx);text-align:center;font-size:1.5rem;font-weight:700;padding:8px;margin:0 auto;max-width:300px}
h2{font-size:1rem;margin:0 0 8px}
.sub{color:var(--sub);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:14px}
input,button,textarea{font:inherit;color:var(--tx)}
input,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.wrap{overflow-x:auto}
#map{display:grid;gap:0;min-width:620px;grid-template-columns:134fr 133fr 113fr 122fr 108fr 135fr 135fr;grid-template-rows:76px 76px 76px 76px 76px 50px 76px 68px}
.seat{width:100%;height:100%;border-radius:0;border:2px solid var(--tx);padding:2px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:.8rem;line-height:1.3;background:var(--card)}
.seat b{font-size:1rem}
.seat.sel{outline:3px solid var(--ac);outline-offset:-5px}
.mid{display:flex;align-items:center;justify-content:center;text-align:center;font-size:.78rem;padding:4px 10px;color:var(--sub)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button.on-g{background:var(--good);color:#fff;border-color:var(--good)}
.opts button.on-b{background:var(--bad);color:#fff;border-color:var(--bad)}
.rv{border-top:1px solid var(--bd);padding:8px 0;font-size:.9rem}
.g{color:var(--good)}.b{color:var(--bad)}
ol{padding-left:22px;margin:0}
label{font-size:.8rem;color:var(--sub);display:block}
.badge{font-size:.7rem;color:var(--good)}
</style>
</head>
<body>
<main>
<div class="title">10월 부동산</div>
<div class="sub" id="status" style="text-align:center;margin-top:6px"></div>

<section class="card" id="nameCard">
  <label>내 이름</label>
  <input id="me" placeholder="이름 입력" maxlength="12" style="max-width:240px">
</section>

<section class="card">
  <h2 id="mapTitle">자리를 눌러 호/불호를 평가해 주세요</h2>
  <div class="wrap"><div id="map"></div></div>
</section>

<section class="card" id="panel" hidden>
  <h2 id="ptitle"></h2>
  <div id="pinfo" class="sub"></div>
  <div id="stuBox">
    <div style="margin:10px 0 6px"><label>호 / 불호와 강도</label></div>
    <div class="opts" id="opts"></div>
    <div style="margin-top:10px"><label>이유 (필수)</label><textarea id="reason" rows="2" maxlength="120" placeholder="예: 창가라 햇빛이 좋아요"></textarea></div>
    <div class="row" style="margin-top:8px"><button class="pri" id="save">평가 저장</button><span class="sub" id="msg"></span></div>
  </div>
  <div style="margin-top:12px" id="rvs"></div>
</section>

<section class="card" id="tCard" hidden>
  <h2>🔒 시세 순위 (교사 전용)</h2>
  <div class="row" style="margin-bottom:8px">
    <div><label>최대 하락(%)</label><input id="dn" type="number" value="30" style="width:90px"></div>
    <div><label>최대 상승(%)</label><input id="up" type="number" value="70" style="width:90px"></div>
    <div><label>9월 미입력 자리 기준가</label><input id="base" type="number" value="450" style="width:110px"></div>
  </div>
  <div class="sub" style="margin-bottom:8px">10월 가격 = 9월 가격 × (1 + 등락률). 점수 합계가 가장 낮은 자리는 최대 하락, 가장 높은 자리는 최대 상승이고 나머지는 그 사이예요. 상승폭이 하락폭보다 커서 전체적으로 오르는 장이 돼요. (10 단위 반올림)</div>
  <details style="margin:8px 0"><summary>9월 시세 입력 (자리별)</summary><div id="sepGrid" class="row" style="margin-top:8px"></div><button id="sepSave" style="margin-top:8px">9월 시세 저장</button></details>
  <ol id="rank"></ol>
  <h2 style="margin-top:14px">💸 매도 의향 문의 대상 (시세차익 큰 순)</h2>
  <ol id="sell"></ol>
  <div class="sub" style="margin-top:10px" id="who"></div>
</section>
<div class="sub" style="text-align:center;margin:18px 0"><a href="#" id="tLogin" style="color:inherit">교사 로그인</a><span id="tOut" hidden> · <a href="#" id="tRef" style="color:inherit">새로고침</a> · <a href="#" id="tLogout" style="color:inherit">로그아웃</a></span></div>
</main>

<script>
const $=id=>document.getElementById(id);
// [번호, 열, 행]  — 사진의 배치 기준
const SEATS=[['1-1',1,1],['1-2',2,1],['1-3',1,2],['1-4',2,2],
['5-1',6,1],['5-2',7,1],['5-3',6,2],['5-4',7,2],
['2-1',1,4],['2-2',2,4],['2-3',1,5],['2-4',2,5],
['4-1',6,4],['4-2',7,4],['4-3',6,5],['4-4',7,5],
['3-1',4,7],['3-2',5,7],['3-3',3,8],['3-4',4,8],['3-5',5,8]];
const COND='고려된 입지 조건<br>일조권(햇빛), 교육환경(TV와 칠판, 선생님 시야), 접근성(문/사물함 등 교실 내 편의시설), 생활환경(짝이 많음, 주변이 시끄러움, 구석이라 편함), 프라이버시 등';
let isTeacher=false, ratings=[], sel=null, pick=null, mine={};
try{mine=JSON.parse(localStorage.getItem('seat10-mine')||'{}')}catch(e){}
try{$('me').value=localStorage.getItem('seat10-me')||''}catch(e){}
$('me').oninput=()=>{try{localStorage.setItem('seat10-me',$('me').value)}catch(e){}render()};
const hid=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))>>>0;return 'r'+h.toString(36)+s.length.toString(36)};
const key=seat=>$('me').value.trim()+'|'+seat;

function stats(seat){
  const rs=ratings.filter(r=>r.seat===seat);
  const pos=rs.filter(r=>r.score>0).reduce((a,r)=>a+r.score,0);
  const neg=rs.filter(r=>r.score<0).reduce((a,r)=>a-r.score,0);
  return {rs,pos,neg,net:pos-neg};
}
function prices(){
  const dn=parseFloat($('dn').value)||0, up=parseFloat($('up').value)||0, def=parseFloat($('base').value)||450;
  const nets=SEATS.map(x=>stats(x[0]).net), mn=Math.min(...nets), mx=Math.max(...nets);
  const out={};
  SEATS.forEach((x,i)=>{
    const t=mx===mn?.5:(nets[i]-mn)/(mx-mn), prev=+sep[x[0]]||def;
    const price=Math.max(10,Math.round(prev*(1+(-dn+t*(dn+up))/100)/10)*10);
    out[x[0]]={t,prev,price,ch:price-prev,pct:Math.round((price-prev)/prev*100)};
  });
  return out;
}
const chTxt=p=>`${p.ch>=0?'▲ +':'▼ '}${p.ch} (${p.pct>=0?'+':''}${p.pct}%)`;
function el(tag,txt,cls){const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}

function render(){
  const map=$('map');map.innerHTML='';
  const P=isTeacher?prices():null;
  const c1=el('div','',null);c1.className='mid';c1.style.cssText='grid-column:3/6;grid-row:3';
  c1.textContent=isTeacher?'10월 부동산 시세':'10월 자리 평가';map.appendChild(c1);
  const c2=el('div','','mid');c2.style.cssText='grid-column:3/6;grid-row:4/6';c2.innerHTML=COND;map.appendChild(c2);
  SEATS.forEach(([id,c,r])=>{
    const b=el('button','','seat'+(sel===id?' sel':''));b.style.gridColumn=c;b.style.gridRow=r;
    b.appendChild(el('b',id));
    if(isTeacher){
      const p=P[id];
      b.appendChild(el('span',p.price));
      b.appendChild(el('span',chTxt(p),p.ch>=0?'g':'b'));
      const a=Math.min(.6,.1+Math.abs(p.pct)/100);
      b.style.background=p.ch>=0?`rgba(47,143,90,${a})`:`rgba(217,102,40,${a})`;
    }else if(mine[key(id)]){
      b.appendChild(el('span','✔ 평가함','badge'));
    }
    b.onclick=()=>{sel=id;pick=null;$('reason').value='';$('msg').textContent='';
      const m=mine[key(id)];if(m){pick=m.score;$('reason').value=m.reason}render()};
    map.appendChild(b);
  });
  $('nameCard').hidden=isTeacher;
  $('mapTitle').textContent=isTeacher?'자리별 시세 (교사 전용)':'자리를 눌러 호/불호를 평가해 주세요';
  renderPanel();renderRank();
}
function renderPanel(){
  $('panel').hidden=sel==null;if(sel==null)return;
  $('ptitle').textContent=sel+' 자리';
  $('stuBox').hidden=isTeacher;
  const box=$('rvs');box.innerHTML='';
  if(isTeacher){
    const s=stats(sel),p=prices()[sel];
    $('pinfo').textContent=`9월 ${p.prev} → 10월 ${p.price} ${chTxt(p)} · 호 +${s.pos} / 불호 −${s.neg} (합계 ${s.net>0?'+':''}${s.net})`;
    if(!s.rs.length)box.appendChild(el('div','아직 평가가 없어요.','sub'));
    s.rs.forEach(r=>{const d=el('div','','rv');d.appendChild(el('b',r.name+' '));
      d.appendChild(el('span',(r.score>0?'+':'')+r.score,r.score>0?'g':'b'));d.appendChild(el('div',r.reason));box.appendChild(d)});
    return;
  }
  $('pinfo').textContent='다른 친구의 평가와 가격은 공개되지 않아요.';
  const o=$('opts');o.innerHTML='';
  [5,4,3,2,1,-1,-2,-3,-4,-5].forEach(v=>{
    const b=el('button',v>0?`👍 +${v}`:`👎 ${v}`);if(pick===v)b.className=v>0?'on-g':'on-b';
    b.onclick=()=>{pick=v;renderPanel()};o.appendChild(b);
  });
}
function renderRank(){
  $('tCard').hidden=!isTeacher;if(!isTeacher)return;
  const P=prices(),ol=$('rank');ol.innerHTML='';
  const all=SEATS.map(x=>({id:x[0],...stats(x[0]),...P[x[0]]}));
  [...all].sort((a,b)=>b.price-a.price||b.net-a.net)
    .forEach(a=>ol.appendChild(el('li',`${a.id} — 9월 ${a.prev} → 10월 ${a.price} ${chTxt(a)} · 합계 ${a.net>0?'+':''}${a.net}, ${a.rs.length}명`)));
  const sl=$('sell');sl.innerHTML='';
  all.filter(a=>a.ch>0).sort((a,b)=>b.ch-a.ch).forEach(a=>sl.appendChild(el('li',`${a.id} — 차익 +${a.ch} (${a.prev} → ${a.price})`)));
  const names=[...new Set(ratings.map(r=>r.name))];
  $('who').textContent=`참여 학생 ${names.length}명: ${names.join(', ')||'-'}`;
}
$('dn').oninput=$('up').oninput=$('base').oninput=render;

let sep={}, pw='', timer=null;
try{pw=sessionStorage.getItem('seat10-pw')||''}catch(e){}
const api=(path,opt={})=>fetch('/api/'+path,{...opt,headers:{'content-type':'application/json','x-admin':pw}});

$('save').onclick=async()=>{
  const name=$('me').value.trim(),reason=$('reason').value.trim();
  if(!name)return $('msg').textContent='이름을 먼저 입력하세요.';
  if(pick==null)return $('msg').textContent='호/불호 점수를 선택하세요.';
  if(!reason)return $('msg').textContent='이유를 작성해야 저장돼요.';
  try{
    const r=await api('rate',{method:'POST',body:JSON.stringify({name,seat:sel,score:pick,reason})});
    if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);
    mine[key(sel)]={score:pick,reason};
    try{localStorage.setItem('seat10-mine',JSON.stringify(mine))}catch(e){}
    $('msg').textContent='저장됐어요 ✅';render();
  }catch(e){$('msg').textContent='저장 실패: '+e.message}
};
function sepUI(){
  const g=$('sepGrid');g.innerHTML='';
  SEATS.forEach(x=>{const d=el('div');d.appendChild(el('label',x[0]));
    const i=el('input');i.type='number';i.dataset.id=x[0];i.style.width='78px';i.value=sep[x[0]]??'';d.appendChild(i);g.appendChild(d)});
}
$('sepSave').onclick=async()=>{
  const n={};$('sepGrid').querySelectorAll('input').forEach(i=>{if(i.value!=='')n[i.dataset.id]=+i.value});
  try{const r=await api('sep',{method:'PUT',body:JSON.stringify({sep:n})});
    if(!r.ok)throw 0;sep=n;$('status').textContent='9월 시세 저장됨'}catch(e){$('status').textContent='9월 시세 저장 실패'}
  render();
};
async function load(){
  try{
    const r=await api('results');
    if(r.status===401){logout();$('status').textContent='비밀번호가 올바르지 않아요.';return false}
    if(!r.ok)throw new Error(r.status);
    const d=await r.json(),first=!isTeacher;
    ratings=d.ratings;sep=d.sep||{};isTeacher=true;
    if(first)sepUI();
    $('status').textContent=`교사 화면 · 평가 ${ratings.length}건 · ${new Date().toLocaleTimeString('ko-KR')}`;
    $('tOut').hidden=false;render();return true;
  }catch(e){$('status').textContent='결과를 불러오지 못했어요: '+e.message;return false}
}
function logout(){
  pw='';isTeacher=false;ratings=[];clearInterval(timer);$('tOut').hidden=true;$('status').textContent='';
  try{sessionStorage.removeItem('seat10-pw')}catch(e){}render();
}
async function start(){
  if(!(await load()))return;
  try{sessionStorage.setItem('seat10-pw',pw)}catch(e){}
  clearInterval(timer);timer=setInterval(load,60000);
}
$('tLogin').onclick=e=>{e.preventDefault();const p=prompt('교사 비밀번호');if(!p)return;pw=p;start()};
$('tRef').onclick=e=>{e.preventDefault();load()};
$('tLogout').onclick=e=>{e.preventDefault();logout()};
render();
if(pw)start();
</script>
</body>
</html>
